<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ridhusbokning | RingstadStallarna</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{
--gold:#D4AF37;
--dark:#0B0B0B;
--card:#151515;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0b0b0b;
color:white;
font-family:'Inter',sans-serif;
}

.container{
max-width:1100px;
margin:auto;
padding:40px 20px;
}

header{
text-align:center;
padding:60px 20px 40px;
}

.logo{
width:120px;
border-radius:50%;
margin-bottom:20px;
}

h1{
font-family:'Cormorant Garamond',serif;
font-size:3rem;
color:var(--gold);
}

.subtitle{
margin-top:15px;
color:#cfcfcf;
}

.legend{
display:flex;
justify-content:center;
gap:20px;
margin-top:25px;
flex-wrap:wrap;
}

.legend span{
display:flex;
align-items:center;
gap:8px;
}

.dot{
width:12px;
height:12px;
border-radius:50%;
}

.green{background:#22c55e;}
.orange{background:#f59e0b;}
.red{background:#ef4444;}

.booking-box{
margin-top:50px;
background:var(--card);
padding:30px;
border-radius:20px;
border:1px solid rgba(255,255,255,.08);
}

.booking-box h2{
color:var(--gold);
margin-bottom:20px;
}

.date-selector{
margin-bottom:25px;
}

.date-selector input{
width:100%;
padding:14px;
background:#222;
border:none;
color:white;
border-radius:12px;
}

.times{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-top:20px;
}

.slot{
padding:18px;
border-radius:15px;
font-weight:600;
text-align:center;
cursor:pointer;
}

.available{
background:rgba(34,197,94,.15);
border:1px solid #22c55e;
color:#22c55e;
}

.reserved{
background:rgba(245,158,11,.15);
border:1px solid #f59e0b;
color:#f59e0b;
}

.booked{
background:rgba(239,68,68,.15);
border:1px solid #ef4444;
color:#ef4444;
}

.form-box{
margin-top:50px;
background:var(--card);
padding:30px;
border-radius:20px;
}

.form-box h2{
color:var(--gold);
margin-bottom:20px;
}

form{
display:grid;
gap:15px;
}

input,
select,
textarea{

padding:15px;
border:none;
border-radius:12px;
background:#222;
color:white;
font-size:1rem;
}

textarea{
height:120px;
resize:none;
}

button{
padding:15px;
background:var(--gold);
border:none;
border-radius:12px;
font-weight:700;
cursor:pointer;
}

footer{
text-align:center;
padding:40px 20px;
margin-top:50px;
border-top:1px solid rgba(255,255,255,.08);
}

.footer-copy{
color:#999;
margin-bottom:10px;
}

.footer-services{
color:var(--gold);
}

</style>
</head>

<body>

<header>

<img src="Logo.JPG" class="logo">

<h1>Ridhusbokning</h1>

<p class="subtitle">
Boka ridhuset i pass om 60 minuter
</p>

<div class="legend">
<span><div class="dot green"></div> Ledig</span>
<span><div class="dot orange"></div> Reserverad</span>
<span><div class="dot red"></div> Bokad</span>
</div>

</header>

<div class="container">

<div class="booking-box">

<h2>Schema</h2>

<div class="date-selector">

<input type="date">

</div>

<div class="times">

<div class="slot available">
08:00 - 09:00
</div>

<div class="slot booked">
09:00 - 10:00
</div>

<div class="slot available">
10:00 - 11:00
</div>

<div class="slot reserved">
11:00 - 12:00
</div>

<div class="slot available">
12:00 - 13:00
</div>

<div class="slot booked">
13:00 - 14:00
</div>

</div>

</div>

<div class="form-box">

<h2>Boka tid</h2>

<form>

<select required>
<option value="">Kategori</option>
<option>Inackorderad</option>
<option>Extern ryttare</option>
</select>

<input type="text" placeholder="Namn">

<input type="tel" placeholder="Telefon">

<input type="email" placeholder="E-post">

<select required>
<option value="">Välj tid</option>
<option>08:00 - 09:00</option>
<option>09:00 - 10:00</option>
<option>10:00 - 11:00</option>
</select>

<textarea placeholder="Övrig information"></textarea>

<button type="submit">

Skicka bokningsförfrågan

</button>

</form>

</div>

</div>

<footer>

<div class="footer-copy">
© 2026 RINGSTADSTALLARNA
</div>

<div class="footer-services">
Inackordering • Träning • Utbildning
</div>

</footer>

</body>
</html>
