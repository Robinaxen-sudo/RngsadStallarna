<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ridhusbokning | RingstadStallarna</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    padding:0;
    background:#0b0b0b;
    color:#fff;
    font-family:'Inter',sans-serif;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    color:#D4AF37;
}

.times{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px;
    margin-top:20px;
}

.slot{
    background:rgba(34,197,94,.15);
    border:1px solid #22c55e;
    color:#22c55e;
    padding:16px;
    border-radius:12px;
    text-align:center;
    cursor:pointer;
    font-weight:600;
}

.slot:hover{
    transform:translateY(-2px);
}

.slot.selected{
    background:#D4AF37;
    color:#111;
    border-color:#D4AF37;
}

.selected-time{
    text-align:center;
    margin:25px 0;
    font-size:1.1rem;
}

#selectedTime{
    color:#D4AF37;
    font-weight:700;
}

.booking-note{
    text-align:center;
    color:#9c9c9c;
    line-height:1.6;
    margin:15px 0;
}

#bookingDate{
    width:100%;
    padding:18px;
    background:#1f1f1f;
    color:#D4AF37;
    border:1px solid rgba(212,175,55,.25);
    border-radius:16px;
    font-size:1rem;
    box-sizing:border-box;
}

#bookingDate::-webkit-calendar-picker-indicator{
    filter:invert(1);
    cursor:pointer;
}

form{
    display:grid;
    gap:15px;
    margin-top:25px;
}

input,
select,
textarea{
    width:100%;
    padding:15px;
    background:#222;
    color:#fff;
    border:none;
    border-radius:12px;
    box-sizing:border-box;
}

textarea{
    min-height:120px;
}

button{
    background:#D4AF37;
    color:#111;
    border:none;
    padding:15px;
    border-radius:12px;
    font-weight:700;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

</style>
</head>
<body>

<div class="container">

<h1>RIDHUSBOKNING</h1>

<div class="times" id="times"></div>

<p class="booking-note">
<b>EXTERNA RYTTARE</b> kan boka upp till <b>7 dagar</b> framåt.<br>
<b>INACKORDERADE</b> kan boka upp till <b>14 dagar</b> framåt.
</p>

<input type="date" id="bookingDate">

<div class="selected-time">
Vald tid:
<span id="selectedTime">Ingen tid vald</span>
</div>

<form id="bookingForm">

<input
type="text"
id="valdTid"
placeholder="Välj en tid ovan"
readonly>

<select id="ryttartyp" required>
    <option value="">RYTTARTYP</option>
    <option value="inackorderad">INACKORDERAD</option>
    <option value="extern">EXTERN RYTTARE</option>
</select>

<input
type="text"
id="namn"
placeholder="Namn"
required>

<input
type="tel"
id="telefon"
placeholder="Telefon"
required>

<input
type="email"
id="epost"
placeholder="E-post"
required>

<textarea
id="meddelande"
placeholder="Övrig information"></textarea>

<button type="submit">
BOKA RIDHUSET
</button>

</form>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
<script>
const supabaseUrl =
'https://demanqazbewubywncgst.supabase.co';

const supabaseKey =
'sb_publishable_asApF37M5MQuVdovd5aKyw_X_lOPqMT';

const { createClient } =
window.supabase;

const db =
createClient(
    supabaseUrl,
    supabaseKey
);

console.log('Supabase ansluten');
const timesContainer =
document.getElementById('times');

for(let h=5; h<22; h++){

    const slot =
    document.createElement('div');

    slot.className =
    'slot';

    slot.textContent =
    `${String(h).padStart(2,'0')}:00 - ${String(h+1).padStart(2,'0')}:00`;

    timesContainer.appendChild(slot);

}

const slots =
document.querySelectorAll('.slot');

const selectedTime =
document.getElementById('selectedTime');

const valdTid =
document.getElementById('valdTid');

slots.forEach(slot => {

    slot.addEventListener('click', () => {

        slots.forEach(s =>
            s.classList.remove('selected')
        );

        slot.classList.add('selected');

        selectedTime.textContent =
        slot.textContent;

        valdTid.value =
        slot.textContent;

    });

});

const bookingDate =
document.getElementById('bookingDate');

const ryttartyp =
document.getElementById('ryttartyp');

const idag =
new Date();

function formatDate(date){
    return date
        .toISOString()
        .split('T')[0];
}

bookingDate.min =
formatDate(idag);

bookingDate.value =
formatDate(idag);

ryttartyp.addEventListener('change', () => {

    const maxDatum =
    new Date();

    if(
        ryttartyp.value ===
        'inackorderad'
    ){
        maxDatum.setDate(
            idag.getDate() + 14
        );
    }
    else{
        maxDatum.setDate(
            idag.getDate() + 7
        );
    }

    bookingDate.max =
    formatDate(maxDatum);

});

document
.getElementById('bookingForm')
.addEventListener('submit', async (e) => {

    e.preventDefault();

    const bokning = {

        datum: bookingDate.value,

        tid: valdTid.value,

        ryttartyp: ryttartyp.value,

        namn:
        document.getElementById('namn').value,

        telefon:
        document.getElementById('telefon').value,

        epost:
        document.getElementById('epost').value,

        meddelande:
        document.getElementById('meddelande').value

    };

    const { error } =
    await db
        .from('ridhus_bokningar')
        .insert([bokning]);

if(error){

    console.error(error);

    alert(
        error.message
    );

    return;

}

    alert(
        '✅ Bokningen är registrerad!'
    );

});
</script>

</body>
</html>
