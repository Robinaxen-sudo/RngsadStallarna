<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ridhusbokning | RingstadStallarna</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    padding:0;
    background:#0b0b0b;
    color:#fff;
    font-family:'Inter',sans-serif;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    color:#D4AF37;
}

.times{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;
    margin-top:30px;
}

.slot{
    background:rgba(34,197,94,.15);
    border:1px solid #22c55e;
    color:#22c55e;
    padding:16px;
    border-radius:12px;
    text-align:center;
    cursor:pointer;
    font-weight:600;
}

.slot:hover{
    transform:translateY(-2px);
}

</style>
</head>

<body>

<div class="container">

<h1>Ridhusbokning</h1>

<div class="times">

<div class="slot">08:00 - 09:00</div>
<div class="slot">09:00 - 10:00</div>
<div class="slot">10:00 - 11:00</div>
<div class="slot">11:00 - 12:00</div>

<div class="slot">12:00 - 13:00</div>
<div class="slot">13:00 - 14:00</div>
<div class="slot">14:00 - 15:00</div>
<div class="slot">15:00 - 16:00</div>

<div class="slot">16:00 - 17:00</div>
<div class="slot">17:00 - 18:00</div>
<div class="slot">18:00 - 19:00</div>
<div class="slot">19:00 - 20:00</div>

</div>

</div>

</body>
</html>
