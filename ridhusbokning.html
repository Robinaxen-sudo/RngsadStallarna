<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ridhusbokning | RingstadStallarna</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    padding:0;
    background:#0b0b0b;
    color:#fff;
    font-family:'Inter',sans-serif;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    color:#D4AF37;
}

.times{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;
    margin-top:30px;
}

.slot{
    background:rgba(34,197,94,.15);
    border:1px solid #22c55e;
    color:#22c55e;
    padding:16px;
    border-radius:12px;
    text-align:center;
    cursor:pointer;
    font-weight:600;
}

.slot:hover{
    transform:translateY(-2px);
}
.selected-time{
    margin-top:25px;
    text-align:center;
    font-size:1.1rem;
}

#selectedTime{
    color:#D4AF37;
    font-weight:700;
}
.slot.selected{
    background:#D4AF37;
    color:#111;
    border-color:#D4AF37;
}
    form{
    display:grid;
    gap:15px;
    margin-top:30px;
}

form select,
form input,
form textarea{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#222;
    color:#fff;
    font-size:1rem;
}

form textarea{
    min-height:120px;
    resize:vertical;
}

form button{
    background:#D4AF37;
    color:#111;
    border:none;
    border-radius:12px;
    padding:15px;
    font-weight:700;
    cursor:pointer;
}

form button:hover{
    opacity:.9;
}
    #bookingDate{
    width:100%;
    padding:18px;
    background:#1f1f1f;
    color:#D4AF37;
    border:1px solid rgba(212,175,55,.25);
    border-radius:16px;
    font-size:1.1rem;
    margin:25px 0;
    box-sizing:border-box;
}

    .booking-note{
    text-align:center;
    color:#9c9c9c;
    font-size:0.9rem;
    margin-top:10px;
    margin-bottom:20px;
}

</style>
</head>

<body>
<div class="selected-time">

Vald tid:

<span id="selectedTime">
Ingen tid vald
</span>

</div>
<div class="container">

<h1>Ridhusbokning</h1>
    
<div class="times">
<div class="slot">08:00 - 09:00</div>
<div class="slot">09:00 - 10:00</div>
<div class="slot">10:00 - 11:00</div>
<div class="slot">11:00 - 12:00</div>

<div class="slot">12:00 - 13:00</div>
<div class="slot">13:00 - 14:00</div>
<div class="slot">14:00 - 15:00</div>
<div class="slot">15:00 - 16:00</div>

<div class="slot">16:00 - 17:00</div>
<div class="slot">17:00 - 18:00</div>
<div class="slot">18:00 - 19:00</div>
<div class="slot">19:00 - 20:00</div><h3 class="date-title">

    <p class="booking-note">
Ridhustider kan bokas upp till 7 dagar framåt.
</p>

Välj datum
</h3>

<input type="date" id="bookingDate">

</div>
<form id="bookingForm">
    
<input
type="text"
id="valdTid"
placeholder="Välj en tid ovan"
readonly>
    
<select id="ryttartyp" required>
    <option value="">Kategori</option>
    <option>Inackorderad</option>
    <option>Extern ryttare</option>
</select>

<input type="text" id="namn" placeholder="Namn" required>

<input type="tel" id="telefon" placeholder="Telefon" required>

<input type="email" id="epost" placeholder="E-post" required>

<textarea id="meddelande"
placeholder="Övrig information"></textarea>

<button type="submit">
Boka ridhuset
</button>

</form>
</div>
<script>

const slots = document.querySelectorAll('.slot');
const selectedTime = document.getElementById('selectedTime');

slots.forEach(slot => {

    slot.addEventListener('click', () => {

        slots.forEach(s => {
            s.classList.remove('selected');
        });

        slot.classList.add('selected');

const tid = slot.textContent.trim();

selectedTime.textContent = tid;

document.getElementById('valdTid').value = tid;

    });

});

    const bookingDate =
document.getElementById('bookingDate');

const idag = new Date();

const maxDatum = new Date();
maxDatum.setDate(idag.getDate() + 7);

const formatDate = (date) => {
    return date.toISOString().split('T')[0];
};

bookingDate.min = formatDate(idag);
bookingDate.max = formatDate(maxDatum);
bookingDate.value = formatDate(idag);


</script>

    
</body>
</html>
